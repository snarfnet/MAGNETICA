name: MAGNETICA
options:
  bundleIdPrefix: com.snarfnet
  deploymentTarget:
    iOS: "16.0"
targets:
  MAGNETICA:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MAGNETICA
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: MAGNETICA uses motion sensors to detect magnetic fields and visualize aura energy around you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snarfnet.magnetica
        DEVELOPMENT_TEAM: 83VGKGSQUH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
