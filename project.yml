name: MAGNETICA
options:
  bundleIdPrefix: com.snarfnet
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
targets:
  MAGNETICA:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MAGNETICA
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: MAGNETICA uses motion sensors to detect magnetic fields and visualize aura energy around you.
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snarfnet.magnetica
        DEVELOPMENT_TEAM: 83VGKGSQUH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_GADApplicationIdentifier: ca-app-pub-9404799280370656~5836829386
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSUserTrackingUsageDescription: This identifier may be used to show relevant ads and measure ad performance.
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
